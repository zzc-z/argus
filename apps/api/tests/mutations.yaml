# 变异测试清单
#
# 用途：验证「每个新测试都真的能抓到它要防的 bug」（项目规则要求）。
#
# 跑法：
#   uv run python -m tests.mutation          # 全跑
#   uv run python -m tests.mutation M1 M3   # 只跑指定几条
#
# **每条变异都必须让指定测试变红**。没变红说明那条测试是废的，或者变异
# 根本没生效（from 字符串没匹配上）——后者更危险：你会以为验过了。
#
# 加新条目时：
#   1. 写一条新测试（先确认它**能**抓住这个变异）
#   2. 在这里加一条
#   3. 跑一遍确认绿

mutations:
  # ── 节点耗时的累计 ──
  - id: M1
    desc: 节点耗时不算累计（只算最后一段）
    file: app/services/agent_nodes.py
    from: 'total = self._accumulated_ms.get(stage, 0) + segment'
    to: 'total = segment'
    expect_fail: test_agent_stages.py

  # ── 节点的产出摘要 ──
  # from 必须**唯一**：``complete()`` 与 ``fail()`` 里都有同一行
  # ``note=self._notes.pop(...)``，只写这一行会让变异落到靠前的那处
  # （未必是意图位置），而测试仍会变红 —— 假阳性。故带上 lifecycle 上下文。
  - id: M2
    desc: 节点完成帧不带产出摘要
    file: app/services/agent_nodes.py
    from: "lifecycle=\"completed\",\n            elapsed_ms=elapsed,\n            note=self._notes.pop(self._active, \"\"),"
    to: "lifecycle=\"completed\",\n            elapsed_ms=elapsed,\n            note=\"\","
    expect_fail: test_agent_stages.py

  # ── Analyst 降级时说假话 ──
  - id: M3
    desc: Analyst 降级时仍写「未发现矛盾」
    file: app/services/stages.py
    from: 'if analysis.degraded:'
    to: 'if False:'
    expect_fail: test_agent_stages.py

  # ── Analyst 的「有没有新证据」判据 ──
  - id: M4
    desc: seen 记录全部引用（而非实际送进模型的那些）
    file: app/services/stages.py
    from: 'seen.update({("ref", ref.chunk_id) for ref in selected})'
    to: 'seen.update({("ref", ref.chunk_id) for ref in unique})'
    expect_fail: test_agent_stages.py

  # ── Supervisor 阶段取消 ──
  # from 必须**唯一**：``yield ledger.done()`` 在文件里出现两处（取消路径
  # 与「未产出内容」路径）。只写这一行会让变异落到靠前的那处——当前恰好
  # 是意图位置，但那是运气，不是保证。带上 ``_fail`` 上下文锁定取消路径。
  - id: M5
    desc: Supervisor 阶段取消时不发 done（前端会一直转圈）
    file: app/services/agent.py
    # 换成 error 而不是删掉 yield——删掉会让 run_agent 不再是生成器，
    # 整个模块 import 失败（pytest 收集不到测试），那不叫「测试有效」。
    from: "        for event in _fail(tracker, \"已取消\"):\n            yield event\n        yield ledger.done()"
    to: "        for event in _fail(tracker, \"已取消\"):\n            yield event\n        yield ErrorEvent(code=\"wrong_event\", message=\"x\")"
    expect_fail: test_agent_stages.py

  # ── 公开来源：session_maker 接线 ──
  - id: M6
    desc: 生产调用点漏传 session_maker（公开来源走 SAVEPOINT 路径）
    file: app/services/tools.py
    from: '            session_maker=context.session_maker,'
    to: '            # 漏传'
    expect_fail: test_web_sources.py

  # ── 公开来源：畸形 URL 不能让整批失败 ──
  - id: M7
    desc: 畸形 URL 不捕获 ValueError（整批搜索结果失去角标）
    file: app/services/web_sources.py
    from: "        except ValueError:\n            logger.warning(\"搜索结果的 URL 无法归一化，按无 URL 处理\", exc_info=True)\n            canonical = \"\""
    to: "        except ValueError:\n            raise"
    expect_fail: test_web_sources.py

  # ── 公开来源：证据块要带 URL ──
  - id: M8
    desc: 证据块丢掉 URL（模型没法执行 dedup 指令）
    file: app/services/web_sources.py
    from: 'url_line = f"URL: {item.url}\n" if item.url else ""'
    to: 'url_line = ""'
    expect_fail: test_web_sources.py

  # ── 公开来源：落库要用长内容（不是 Analyst 的短摘要）──
  # from 必须**唯一**：``register_web_sources()``（落库）与
  # ``render_web_evidence()``（渲染给模型看）里是**同一行**，连注释都一样。
  # 只写这一行会让变异落到靠前的那处——当前恰好是落库路径，但那是运气。
  # 带上 ``if not content.strip()`` —— 落库路径独有（渲染路径没有这个判空）。
  - id: M9
    desc: 落库用短摘要（critic 校验的是摘要而不是原文）
    file: app/services/web_sources.py
    from: "        content = (item.content or item.excerpt)[:WEB_CHUNK_CHARS]\n        if not content.strip():"
    to: "        content = item.excerpt[:WEB_CHUNK_CHARS]\n        if not content.strip():"
    expect_fail: test_web_sources.py

  # ── 打字机：节奏必须精确 ──
  - id: M10
    desc: 打字机不控速（正文一下全出）
    file: app/services/stream.py
    from: 'self._credit -= len(piece)'
    to: 'self._credit = 0'
    expect_fail: test_text_slicer.py

  # ── Critic 判定：同一脚注的多句必须各自独立判定 ──
  # 守护的是 verdict key 从字符串改成 (脚注号, 变体序号) 这件事。
  # 把变体后缀整个丢掉（只认脚注号）会让「1b」与「1」都落到 (1, 0)，
  # 两条判定互相覆盖——用户看到的是错的通过率。
  - id: M11
    desc: verdict id 丢掉变体后缀（同一脚注的多句判定互相覆盖）
    file: app/services/faithfulness.py
    from: '    m = re.fullmatch(r"(\d+)(?:b(\d*))?", text)'
    to: '    m = re.fullmatch(r"(\d+)", text)'
    expect_fail: test_faithfulness_judge.py

  - id: M12
    desc: 未支撑条目报告第一句而不是实际被判定的那句
    file: app/services/faithfulness.py
    from: 'Unsupported(footnote=n, variant=variant_index, sentence=sentence, reason=reason)'
    to: 'Unsupported(footnote=n, variant=variant_index, sentence=sentences[n][0], reason=reason)'
    expect_fail: test_faithfulness_judge.py

  # ── Critic：截断必须与「调用失败」区分开 ──
  # 截断是配置问题（max_tokens 不够），混进通用 except 会让用户
  # 看到「无法校验」而排查方向跑偏。
  - id: M13
    desc: 截断不识别（落进通用 except，被标成「校验调用失败」）
    file: app/services/faithfulness.py
    from: '    if final.stop_reason == "max_tokens":'
    to: '    if False:'
    expect_fail: test_faithfulness_judge.py

  - id: M14
    desc: max_tokens 写死 2048（20 条引用会被截断）
    file: app/services/faithfulness.py
    from: '    max_tokens = max(2048, expected_count * 300)'
    to: '    max_tokens = 2048'
    expect_fail: test_faithfulness_judge.py

  - id: M15
    desc: 变体 tag 全部叫 "nb"（同一脚注的第 2 句与第 3 句撞同一个 tag）
    file: app/services/faithfulness.py
    from: 'tag = n if index == 0 else (f"{n}b" if index == 1 else f"{n}b{index}")'
    to: 'tag = n if index == 0 else f"{n}b"'
    expect_fail: test_faithfulness_judge.py

  - id: M16
    desc: 变体序号算错（"b2" 被当成 variant 1，第 3 个变体与第 2 个撞）
    file: app/services/faithfulness.py
    from: '        variant = int(suffix_num)'
    to: '        variant = int(suffix_num) + 1'
    expect_fail: test_faithfulness_judge.py

  # ── Judge prompt：多角标句要按部分判定 ──
  # 缺这条指令时，「一句带两个角标」会被**整句**判成 unsupported
  # （两个角标全错）。实测 κ 从 0.769 掉到 0.892 的反面。
  #
  # 这是**首批针对 prompt 内容的变异**——prompt 改掉不会有任何普通测试失败，
  # 只有变异测试能发现。
  - id: M17
    desc: Judge prompt 丢掉「多角标按部分判定」这条指令
    file: app/services/faithfulness.py
    from: '一句话可能同时引用多份资料（带多个角标）。这时只判断**该句中由本段原文支撑的那部分结论**，不要因为句中的其它部分没有在本段原文中出现就判 unsupported。'
    to: '（多角标句按整句判定。）'
    expect_fail: test_prompt_contracts.py

  # ── 工具入参：必须按 schema 校验 ──
  # 不校验的话，模型少传参数（query 写成 q）会流到工具内部 KeyError →
  # 落进宽兜底 → 模型收到「内部出错，请不要重复调用它」——
  # **模型被告知不要重试**，这次检索就永久丢了。
  - id: M18
    desc: 工具入参不校验（少传必填参数不再报错）
    file: app/services/tools.py
    from: '    missing = [key for key in required if key not in tool_input]'
    to: '    missing = []'
    expect_fail: test_tools.py

  - id: M19
    desc: 工具入参不拦不存在的参数（agent 发明 config 选项不被发现）
    file: app/services/tools.py
    from: '    unknown = [key for key in tool_input if key not in properties]'
    to: '    unknown = []'
    expect_fail: test_tools.py
