# Argus API · ruff 配置（已合并到 pyproject.toml，保留为 .ruff.toml 仅供 pre-commit hooks 单独跑 ruff 用）
target-version = "py312"
line-length = 100
extend-exclude = ["**/alembic/versions/*"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PT", "C4", "RUF", "ASYNC"]
# E501: 行宽由 formatter 管；B008: FastAPI Depends() 默认值是官方推荐写法
# RUF001/002/003: 项目要求注释与 docstring 写中文，全角标点（：，（））会误报
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[lint.per-file-ignores]
"tests/**/*.py" = ["PT", "F401"]  # PT: pytest fixtures；F401: stub imports (W1->W2)

[format]
quote-style = "double"
indent-style = "space"