# Argus API · ruff 配置（已合并到 pyproject.toml，保留为 .ruff.toml 仅供 pre-commit hooks 单独跑 ruff 用）
target-version = "py312"
line-length = 100
extend-exclude = ["**/alembic/versions/*"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PT", "C4", "RUF", "ASYNC"]
ignore = ["E501", "B008"]

[lint.per-file-ignores]
"tests/**/*.py" = ["PT", "F401", "RUF002", "RUF003"]

[format]
quote-style = "double"
indent-style = "space"