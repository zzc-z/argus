[project]
name = "argus-api"
version = "0.1.0"
description = "Argus 多智能体深度研报平台 · 后端 API"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Argus Team" }]
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "redis>=5.2",
    "httpx>=0.27",
    "anthropic>=0.84",
    "langgraph>=1.2.11",
    "langgraph-checkpoint>=4.0",
    "langchain-core>=0.3",
    "openai>=1.55",
    "tenacity>=9.0",
    "structlog>=24.4",
    "pyjwt>=2.9",
    "authlib>=1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-redis",
    "types-pyjwt",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/alembic/versions/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PT", "C4", "RUF", "ASYNC"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PT", "F401", "RUF002", "RUF003"]  # PT: pytest fixtures; F401: stub imports (W1->W2); RUF002/003: 中文标点 in docstrings/comments

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
strict_concatenate = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --tb=short"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:passlib.*",
    "ignore::DeprecationWarning:pydantic.*",
]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/alembic/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 80