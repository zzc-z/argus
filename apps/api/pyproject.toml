[project]
name = "argus-api"
version = "0.1.0"
description = "Argus 多智能体深度研报平台 · 后端 API"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Argus Team" }]
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "redis>=5.2",
    "httpx>=0.27",
    # anthropic 1.9.0 依赖的 httpx 后继版本。**显式声明**：代码里直接
    # import httpx2 判异常类型（httpx 与 httpx2 的异常类不通用，见
    # app/services/llm.py），靠传递依赖等于赌 anthropic 不换依赖树——
    # 一次升级就可能让整个 API import 失败。BSD-3-Clause，pydantic 官方维护。
    "httpx2>=2.0.0,<3",
    "anthropic>=0.84",
    # 代码里直接 import jiter 解析模型返回的 JSON（见 app/services/
    # stages.py 与 faithfulness.py）。**显式声明**：靠 anthropic 的传递
    # 依赖等于赌它不换依赖树——一次升级就可能让整个 API import 失败。
    # 与上面 httpx2 同一个理由。MIT，pydantic 官方维护。
    "jiter>=0.4",
    "langgraph>=1.2.11",
    "langgraph-checkpoint>=4.0",
    "langchain-core>=0.3",
    "openai>=1.55",
    "tenacity>=9.0",
    "structlog>=24.4",
    "pyjwt>=2.9",
    "authlib>=1.8",
    "itsdangerous>=2.2.0",
    "tavily-python>=0.8",
    "python-multipart>=0.0.20",   # FastAPI 收 multipart 上传必需，缺了启动即报错
    # 中文分词：SQLite FTS5 自带分词器对中文全不可用（实测见 app/services/bm25.py）
    "jieba>=0.42",
    # ── RAG 管线（W2 Day 9/10）──
    # 这三个早先是用 `uv pip install` 装的，没写进 pyproject——结果
    # `uv sync` 会把它们卸掉，换台机器整个 RAG 直接 import 失败。
    "pymupdf>=1.24",              # PDF 文本抽取
    # Word (.docx) 文本抽取。只读 OOXML，不支持二进制老 .doc（见
    # parser.DocxParser）。MIT 许可，Python 3.14 上实测可用。
    "python-docx>=1.2",
    "langchain-text-splitters>=1.0",  # 递归字符切片
    "sqlite-vec>=0.1.6",          # 向量检索扩展
    # 网页正文提取。不用正则剥标签（parser.HtmlParser）：同一份 Wikipedia
    # HTML，正则版提 30748 字符、命中 6 处导航/页脚噪音，trafilatura 提
    # 15399 字符、0 噪音——导航文案进 embedding 会直接污染检索。
    # 注意它不能替代 HtmlParser：实测它对极简 HTML 返回 None，
    # 两者是串联关系（fetcher._extract → parser.HtmlParser）。
    "trafilatura>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    # 测试并行。实测全量套件 32.5s → 15.4s（-n 4），见 docs/DEV-FLOW-ANALYSIS.md。
    "pytest-xdist>=3.6",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-redis",
    "types-authlib",
    "aiosqlite>=0.20",   # SQLite dev 驱动；prod 走 asyncpg + Postgres 不需要
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/alembic/versions/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PT", "C4", "RUF", "ASYNC"]
# E501: 行宽由 formatter 管；B008: FastAPI Depends() 默认值是官方推荐写法
# RUF001/002/003: 项目要求注释与 docstring 写中文，全角标点（：，（））会误报
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PT", "F401"]  # PT: pytest fixtures；F401: stub imports (W1->W2)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
strict_concatenate = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# tavily-python 0.8.5 没发 py.typed，也没有官方 types 包（查过 PyPI）。
# 它只在 app/services/llm.py 里做一层薄封装，类型信息由我们自己声明的
# 返回类型兜住，不需要第三方 stub。
[[tool.mypy.overrides]]
module = ["tavily.*"]
ignore_missing_imports = true

# aiosqlite 同样没发 py.typed。但它比 tavily 关键——vectorstore.py 靠它的
# _execute 把同步的 load_extension 丢进工作线程，那是个私有 API，加载失败
# 时没有任何类型或运行时保护。所以对它的未标注调用一律放开，行为由
# tests/test_vectorstore.py 实测保证。
[[tool.mypy.overrides]]
module = ["aiosqlite.*", "sqlite_vec.*"]
ignore_missing_imports = true
disallow_untyped_calls = false

# jieba 没发 py.typed。只用它的 cut()，无类型风险。
[[tool.mypy.overrides]]
module = ["jieba.*"]
ignore_missing_imports = true

# pymupdf 1.28 带 py.typed（所以走 follow_imports 分析路径而非 ignore_missing_imports），
# 但 Document.__iter__ 与 Page.get_text 都没有类型签名。mypy 的模块级 override
# 管不到这里——因为 py.typed 让它检查函数体，所以只能在调用处 inline ignore。
# 行为由 tests/test_parser.py 实测覆盖。

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# --dist=worksteal：动态分配测试，worker 空闲就领下一个。
#
# 试过 --dist=loadscope（xdist 官方针对「同文件共享状态」推荐的方式），
# **不稳定**：3 次里 2 次有测试失败（test_url_ingest.py 的
# test_ssrf_block_is_recorded_without_leaking_internals）。
#
# 原因是 loadscope 按「模块/类」分组，而我们的测试是**函数级**的
# （没有类），于是它退化成 loadfile——某个 worker 背上多个慢文件时，
# 其它 worker 早跑完就空了，负载严重不均。
#
# worksteal 动态分配消除了这个问题，且没有 fixture 碰撞——我们的
# fixture 每个测试独立建库（db_session 用内存 SQLite、shared_db 用
# tmp_path），同文件拆到不同 worker 也互不干扰。
# --maxfail=1：首个失败就停。已经坏了的分支不用跑完全量。
addopts = "-ra --strict-markers --tb=short -p no:faulthandler -n 4 --dist=worksteal --maxfail=1"
markers = [
    "smoke: 冒烟测试——验证包可导入、运行时版本满足下限（CI 快速通道）",
]
# -p no:faulthandler：pytest 内置的 faulthandler 插件与 pymupdf 的 SWIG C 扩展
# （pymupdf/_mupdf.so）在 Python 3.14 上冲突，一import pymupdf 就段错误，
# 且崩在 C 扩展初始化阶段——faulthandler 打印的栈也定位不到根因。
# 它只在崩溃时打印栈，对我们没有净收益。
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:passlib.*",
    "ignore::DeprecationWarning:pydantic.*",
    # asynccontextmanager 在 Python 3.14 起建议用 AsyncGenerator 标注返回类型
    "ignore:.*AsyncIterator.*:DeprecationWarning",
    # SWIG 生成的包装类型缺 __module__，pymupdf 1.28 在 Python 3.14 上必报
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
    # jieba 0.42.1（2020 年发布，PyPI 上最新版）源码里有无效转义序列：
    # jieba/__init__.py:44 的 "\." "\-"、finalseg/__init__.py:78 的 "\."。
    # Python 3.12 起报 SyntaxWarning，3.14 起在**编译期**直接报 SyntaxError。
    # 上面的 "error" 把编译期 SyntaxWarning 升级成异常 → conftest 导入 jieba
    # 时炸掉，整个测试套件收集失败（CI exit code 4）。
    #
    # 这条必须**不限 module**：实测（2026-11-11）编译期告警的 module 字段
    # 是被编译文件的路径而非模块名，"ignore::SyntaxWarning:jieba.*"、
    # ":jieba"、":.*" 全部匹配不上；只有不限 module 的 ignore 生效。
    # 代价是第三方包里其它 SyntaxWarning 也不再拦——可接受，因为
    # 项目自己的代码有 ruff 兜底（ruff W605 会报无效转义）。
    "ignore::SyntaxWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/alembic/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 80

[dependency-groups]
dev = []
