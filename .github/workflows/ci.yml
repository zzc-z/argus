name: CI

on:
  push:
    branches: [master]
  pull_request:

# 同一分支的多次 push 只跑最后一次——省 runner 分钟。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: 后端门禁 + 测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: 装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # 显式 pin 3.14：setup-uv 默认装 latest（当前 3.15），而 ormsgpack
          # 只发到 cp314 的 wheel，3.15 上回退源码编译会被 maturin 拒绝。
          # 与 apps/api/.python-version 保持一致。
          python-version: "3.14"

      - name: 装依赖
        run: uv sync --extra dev

      # 静态检查最快，放最前面——失败就早停，省 runner 分钟。
      - name: ruff
        run: uv run ruff check app/ tests/ alembic/

      - name: mypy
        run: uv run mypy app/

      # 全量测试并行跑（-n 4 配在 pyproject.toml 的 addopts 里）。
      # 单进程跑要 32 秒，并行 14 秒。
      #
      # 测试套件需要几个配置项存在，但**都不需要真值**：
      #   - ANTHROPIC_API_KEY / JWT_SECRET_KEY：非空即可。真实模型调用
      #     全被桩拦掉（conftest 的 _stub_stage_nodes + 各测试的
      #     monkeypatch），key 只用来通过 _require 的非空检查。
      #   - GITHUB_OAUTH_CLIENT_ID / _SECRET：非空即可，测试只验授权
      #     URL 的形状与 PKCE，不发真实 OAuth 请求。
      #   - COOKIE_SECURE=false：默认是 True（见 config.py 的注释——
      #     线上漏配要报错，开发环境漏配只是登不上）。但 CI 走 http，
      #     Secure cookie 不会被 TestClient 送回 → OAuth state cookie 丢失
      #     → state 校验相关用例全挂。
      #   - GITHUB_OAUTH_CALLBACK_URL：要带 /api/v1 前缀，与真实路由
      #     （app/gateway/auth.py 的 prefix）一致。
      #
      # 顺带修了 .env.example 里这个 callback URL 少了 /api/v1 的 bug。
      - name: pytest
        env:
          ANTHROPIC_API_KEY: ci-placeholder-not-a-real-key
          JWT_SECRET_KEY: ci-placeholder-secret-0123456789abcdef
          GITHUB_OAUTH_CLIENT_ID: ci-placeholder-client-id
          GITHUB_OAUTH_CLIENT_SECRET: ci-placeholder-client-secret
          GITHUB_OAUTH_CALLBACK_URL: http://localhost:8000/api/v1/auth/github/callback
          COOKIE_SECURE: "false"
        run: uv run pytest tests/ -q --no-header -p no:cacheprovider

      # 按 OpenAPI 文档自动乱打接口，抓 5xx。没装 schemathesis 时上一步会跳过
      # 这个文件，所以这里单独装、单独跑。--maxfail=0：一次看全所有坏接口。
      - name: schemathesis
        env:
          ANTHROPIC_API_KEY: ci-placeholder-not-a-real-key
          JWT_SECRET_KEY: ci-placeholder-secret-0123456789abcdef  # gitleaks:allow -- CI 占位值,非真实密钥
          GITHUB_OAUTH_CLIENT_ID: ci-placeholder-client-id
          GITHUB_OAUTH_CLIENT_SECRET: ci-placeholder-client-secret
          GITHUB_OAUTH_CALLBACK_URL: http://localhost:8000/api/v1/auth/github/callback
          COOKIE_SECURE: "false"
        run: >
          uv run --with "schemathesis==4.34.2"
          pytest tests/test_api_fuzz.py -q --no-header -p no:cacheprovider --maxfail=0

      - name: ruff format 检查（只查本次改动的文件）
        # 全库 format --check 现状是红的（ruff 版本差异导致，见
        # docs/LOCAL-DEV.md §5），所以只查改动的文件。
        run: |
          git diff --name-only origin/master...HEAD -- 'apps/api/*.py' \
            | sed 's|apps/api/||' \
            | xargs -r uv run ruff format --check

  # 独立 job：漏洞库每天在变，红了要能一眼看出是依赖问题、不是本次改动。
  # 忽略清单是存量，逐条登记在 docs/TODO-code-quality.md B2；升级后删掉对应行，
  # 不要整体关闭，也不要用 continue-on-error。
  audit:
    name: 后端依赖漏洞
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: 装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"

      - name: 导出锁定的生产依赖
        run: uv export --frozen --no-dev --no-hashes --no-emit-project -q -o "$RUNNER_TEMP/requirements.txt"

      - name: pip-audit
        run: >
          uvx "pip-audit==2.10.1" -r "$RUNNER_TEMP/requirements.txt"
          --no-deps --disable-pip --progress-spinner off
          --ignore-vuln PYSEC-2026-4355
          --ignore-vuln PYSEC-2026-4356
          --ignore-vuln PYSEC-2026-4357
          --ignore-vuln PYSEC-2026-4358
          --ignore-vuln PYSEC-2026-4359
          --ignore-vuln PYSEC-2026-4360
          --ignore-vuln CVE-2026-96760
          --ignore-vuln CVE-2026-116672
          --ignore-vuln PYSEC-2026-4320
          --ignore-vuln CVE-2026-119284
          --ignore-vuln CVE-2026-118667
          --ignore-vuln CVE-2026-114603
          --ignore-vuln CVE-2026-126360

  web:
    name: 前端门禁
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本只在根 package.json 的 packageManager 里声明一次。
      # 这里再写 version 会与 packageManager 冲突，action 直接报
      # "Multiple versions of pnpm specified" 并退出（2026-11-11 实测）。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Node 26（Lithium）= Active LTS（2026-10-28 起 LTS，EOL 2029-04-30）。
          # 原先写 20，但 Node 20 已于 2026-04-30 EOL，不再收安全补丁；
          # 且 lint-staged@17 要求 >=22.22.1、@commitlint/cli@21 要求 >=22.12.0
          # —— 声明的 engines 与实际依赖要求本来就不一致。
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 装依赖
        run: pnpm install --frozen-lockfile

      - name: eslint
        run: pnpm run lint

      - name: tsc
        run: pnpm exec tsc --noEmit

  # 变异测试：验证「每条测试真的能抓到它要防的 bug」。
  #
  # **独立 job**，不与 api job 合并——变异测试会**改文件**再改回来
  # （tests/mutation.py 的 try/finally 保证还原）。与 pytest 并发跑会
  # 互相看到对方改到一半的代码，结果不可信。
  #
  # 为什么必须有这道门：变异测试的价值在于「每次改动都跑」，
  # 手动跑一次就没人再跑了。而且它测的是**测试本身的有效性**——
  # 一条断言恒真的测试在普通 pytest 下永远是绿的，只有变异测试能发现。
  mutation:
    name: 变异测试（验证测试有效性）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: 装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # 显式 pin 3.14：setup-uv 默认装 latest（当前 3.15），而 ormsgpack
          # 只发到 cp314 的 wheel，3.15 上回退源码编译会被 maturin 拒绝。
          # 与 apps/api/.python-version 保持一致。
          python-version: "3.14"

      - name: 装依赖
        run: uv sync --extra dev

      # 测试套件需要几个配置项存在但**不需要真值**（同 api job 的说明）。
      # 变异测试跑的是指定测试文件，那些文件里真实模型调用全被桩拦掉。
      - name: 变异测试
        env:
          ANTHROPIC_API_KEY: ci-placeholder-not-a-real-key
          JWT_SECRET_KEY: ci-placeholder-secret-0123456789abcdef
          GITHUB_OAUTH_CLIENT_ID: ci-placeholder-client-id
          GITHUB_OAUTH_CLIENT_SECRET: ci-placeholder-client-secret
          GITHUB_OAUTH_CALLBACK_URL: http://localhost:8000/api/v1/auth/github/callback
          COOKIE_SECURE: "false"
        run: uv run python -m tests.mutation
